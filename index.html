<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일상의 일본어</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f2a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="일본어">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<script>window.AUDIO_BASE='audio/';</script>

<style>
/* Layout: book reader — chapter list on the left (drawer on narrow screens), sticky listening bar, tap-to-speak cards */
:root{
  --bg:#ffffff; --fg:#1e2a2e; --sub:#5f6a6d; --faint:#9aa3a5; --rule:#e3e7e7; --tint:#f2f5f5;
  --accent:#b8432c; --accent-soft:#f8e6e1; --ink:#1f2a2e; --on-ink:#f4ede2; --hl:#fff4d6;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;
  --ko:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;
  --fs:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1c; --fg:#e8ecec; --sub:#a3adb0; --faint:#6f7a7d; --rule:#2a3336; --tint:#1d2427;
  --accent:#e0745b; --accent-soft:#3a2420; --ink:#0d1214; --on-ink:#f4ede2; --hl:#3b3420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1c; --fg:#e8ecec; --sub:#a3adb0; --faint:#6f7a7d; --rule:#2a3336; --tint:#1d2427;
  --accent:#e0745b; --accent-soft:#3a2420; --ink:#0d1214; --on-ink:#f4ede2; --hl:#3b3420; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ko);font-size:16px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
.side{background:var(--ink);color:var(--on-ink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--jp);font-size:13px;font-weight:400;letter-spacing:.4em;color:#d9a48f;margin-bottom:8px}
.toc{margin-top:22px;display:flex;flex-direction:column;gap:2px}
.toc .pt{font-size:12px;letter-spacing:.12em;color:#d9a48f;margin:16px 0 4px;font-weight:700}
.toc button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;font-size:16px;color:var(--on-ink);opacity:.82;display:flex;justify-content:space-between;gap:8px}
.toc button span{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
.toc button:hover{background:rgba(255,255,255,.07);opacity:1}
.toc button[aria-current="true"]{background:rgba(255,255,255,.12);opacity:1;font-weight:700}

.main{min-width:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:860px;margin:0 auto}
.menu{display:none}
.chip{border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:15px;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.play{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.play.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.grow{flex:1}
.vsel{padding:4px 6px 4px 14px}
.setrow{margin-top:8px;padding-top:8px;border-top:1px solid var(--rule)}
#setBtn[aria-expanded="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.vsel span{font-size:14px;color:var(--sub)}
#voice,#kvoice{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;max-width:210px;padding:6px 4px}
.speed{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.speed button{border:0;background:none;padding:8px 12px;font-size:14px;min-height:42px;font-variant-numeric:tabular-nums}
.speed button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
#q{flex:1 1 180px;min-width:0;border:1px solid var(--rule);background:var(--tint);color:var(--fg);border-radius:999px;padding:10px 16px;font-size:16px;min-height:42px}
.warn{max-width:860px;margin:8px auto 0;font-size:14px;line-height:1.6;background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:10px 14px}

.content{max-width:860px;margin:0 auto;padding-block:24px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:13px;letter-spacing:.16em;color:var(--accent);font-weight:700}
h1{font-size:calc(30px*var(--fs));margin:6px 0 4px;text-wrap:balance}
.meta{color:var(--faint);font-size:14px}
.hint{color:var(--sub);font-size:15px;margin:14px 0 6px;line-height:1.6}
.grp{font-size:calc(19px*var(--fs));color:var(--accent);font-weight:800;margin:30px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.grp button{font-size:14px;font-weight:600;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:5px 12px}

.card{display:grid;grid-template-columns:34px minmax(0,1fr) 52px;gap:8px;align-items:start;padding:14px 4px;border-bottom:1px solid var(--rule);border-radius:8px;transition:background .2s}
.card.now{background:var(--hl)}
.ko{font-size:calc(16px*var(--fs));color:var(--sub);line-height:1.5}
.j{font-family:var(--jp);font-size:calc(24px*var(--fs));line-height:1.45;font-weight:600;cursor:pointer;border-radius:6px;margin-left:-4px;padding:1px 4px}
.j:hover{background:var(--tint)}
.j.now{background:var(--accent-soft);color:var(--accent)}
.r{font-family:var(--jp);font-size:calc(17px*var(--fs));color:var(--sub);cursor:pointer}
.k{font-size:calc(16px*var(--fs));color:var(--sub)}
.m{font-size:calc(17px*var(--fs));line-height:1.6}
.n{font-size:calc(15px*var(--fs));line-height:1.7;background:var(--tint);border-radius:8px;padding:8px 12px;margin-top:6px;color:var(--sub)}
.fx{font-size:13px;color:var(--sub);margin-top:4px}
.fx b{color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;font-size:11px;margin-right:6px}
.fx s{color:var(--faint)}
.say{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.say:hover{background:var(--accent);color:#fff}
.say svg{width:24px;height:24px}
.flow{display:flex;flex-direction:column;gap:2px;padding-top:8px}
.flow .j{font-size:calc(21px*var(--fs))}
.flow .k,.flow .m{padding:2px 0}
.empty{color:var(--sub);padding:40px 0;font-size:17px}
.more{display:block;margin:24px auto;padding:12px 26px;font-size:16px;border-radius:999px;border:1px solid var(--rule);background:var(--tint)}

.scrim{display:none}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);height:100%;z-index:40;transform:translateX(-102%);transition:transform .25s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .menu{display:inline-flex}
  .card{grid-template-columns:28px minmax(0,1fr) 48px}
  .say{width:48px;height:48px}
}

.no{background:none;border:0;padding:4px 0 0;text-align:left;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.no::before{content:"▶";font-size:11px;color:var(--accent);opacity:.55}
.no:hover::before{opacity:1}
.np{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);color:var(--on-ink);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.np-in{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.np-txt{flex:1 1 240px;min-width:0}
.np-where{font-size:12px;color:#d9a48f;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-ko{font-size:14px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-ja{font-family:var(--jp);font-size:calc(20px*var(--fs));font-weight:600;line-height:1.35}
.np-btns{display:flex;gap:6px}
.np-btns button{min-height:44px;min-width:58px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--on-ink);font-size:15px;padding:0 12px}
.np-btns .np-stop{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <nav class="side" id="side" aria-label="차례">
    <div class="brand"><small>日常の日本語</small>일상의<br>일본어</div>
    <div class="toc" id="toc"></div>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="bar">
      <div class="bar-row">
        <button class="chip menu" id="menu" aria-label="차례 열기">☰ 차례</button>
        <button class="chip play" id="playAll">▶ 이 장 듣기</button>
        <button class="chip" id="shuffle">섞어 듣기</button>
        <button class="chip" id="setBtn" aria-expanded="false" aria-controls="setRow">설정</button>
        <input id="q" type="search" placeholder="찾기 (예: 食べ, 날씨)" aria-label="찾기">
      </div>
      <div class="bar-row setrow" id="setRow" hidden>
        <div class="speed" role="group" aria-label="말하기 속도">
          <button data-r="0.6">느리게</button><button data-r="0.8">보통</button><button data-r="1">빠르게</button>
        </div>
        <div class="speed" role="group" aria-label="섞어 듣기 범위" id="scope">
          <button data-s="ch">섞기: 이 장</button><button data-s="book">섞기: 책 전체</button>
        </div>
        <button class="chip" id="koToggle" aria-pressed="false">우리말도 읽기</button>
        <button class="chip" id="bigger" aria-label="글자 크기">가 크게</button>
        <label class="chip vsel"><span>목소리</span><select id="voice" aria-label="일본어 목소리"></select></label>
        <button class="chip" id="vtest">시험 듣기</button>
        <label class="chip vsel"><span>우리말 목소리</span><select id="kvoice" aria-label="우리말 목소리"></select></label>
      </div>
      <div class="warn" id="warn" hidden></div>
    </div>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="np" id="np" hidden>
  <div class="np-in">
    <div class="np-txt"><div class="np-where" id="npWhere"></div><div class="np-ko" id="npKo"></div><div class="np-ja" id="npJa"></div></div>
    <div class="np-btns">
      <button id="npPrev" aria-label="이전 문장">이전</button>
      <button id="npStop" class="np-stop" aria-label="멈추기">멈춤</button>
      <button id="npNext" aria-label="다음 문장">다음</button>
    </div>
  </div>
</div>

<script>
const BOOK = JSON.parse(document.getElementById('data').textContent);
const AUDIO = window.AUDIO_BASE || null;          // 녹음 파일 폴더 (웹앱에서만)
const store = { get(k,d){ try{ const v=localStorage.getItem('ilsang-jp-'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem('ilsang-jp-'+k, JSON.stringify(v)); }catch(e){} } };
const chapters = [];
BOOK.forEach(p => p.ch.forEach(c => { c.part = p.t; c.pj = p.j; c.n = c.g.reduce((a,g)=>a+(g.i?g.i.length:0),0); chapters.push(c); }));
const $ = id => document.getElementById(id);

let rate = store.get('rate', 0.8), readKo = store.get('ko', false), fs = store.get('fs', 1), scope = store.get('scope','ch');
let avoice = store.get('avoice', 'kumo');
let jaVoice = null, koVoice = null;
const synth = window.speechSynthesis;
const warn = $('warn');
const AVOICES = [['kumo','쿠모 (남자)'],['alpha','알파 (여자)']];
const ARATE = {0.6:0.75, 0.8:1, 1:1.2};

// ---------- settings panel ----------
const setBtn = $('setBtn'), setRow = $('setRow');
setBtn.onclick = () => { setRow.hidden = !setRow.hidden; setBtn.setAttribute('aria-expanded', String(!setRow.hidden)); };
function quality(v){ const s=(v.name+' '+v.voiceURI).toLowerCase();
  if(s.includes('siri')) return 4; if(s.includes('premium')||s.includes('프리미엄')) return 3;
  if(s.includes('enhanced')||s.includes('향상')||s.includes('고품질')) return 2; return 1; }
function qLabel(v){ return ({4:' · Siri',3:' · 프리미엄',2:' · 향상된 음성',1:''})[quality(v)]; }
const MALE=/Otoya|Hattori/;
const vsel = $('voice'), kvsel = $('kvoice');
const TEST_JA = 'こんにちは。今日もよろしくお願いします。';
function testJa(){
  if (AUDIO) { const id = firstAudioId(); playOnce([{lang:'ja-JP', text:'', a:id}]); }
  else playOnce([{text:TEST_JA, lang:'ja-JP'}]);
}
if (AUDIO) {
  vsel.innerHTML = AVOICES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  vsel.value = avoice;
  vsel.addEventListener('change', () => { avoice = vsel.value; store.set('avoice', avoice); testJa(); });
}
function pickVoices(){
  if(!synth) return;
  const vs = synth.getVoices();
  const ja = vs.filter(v => /^ja/i.test(v.lang)).sort((a,b)=>quality(b)-quality(a) || (MALE.test(b.name)-MALE.test(a.name)) || a.name.localeCompare(b.name));
  if (!jaVoice) { const saved = store.get('voice', null); jaVoice = ja.find(v=>v.voiceURI===saved) || ja[0] || null; }
  if (!AUDIO) {
    vsel.innerHTML = ja.map(v=>`<option value="${v.voiceURI.replace(/"/g,'&quot;')}">${v.name.replace(/\s*\(.*?\)\s*/g,'')}${MALE.test(v.name)?' (남)':''}${qLabel(v)}</option>`).join('') || '<option>일본어 음성 없음</option>';
    if(jaVoice) vsel.value = jaVoice.voiceURI;
  }
  const ko = vs.filter(v => /^ko/i.test(v.lang)).sort((a,b)=>quality(b)-quality(a) || a.name.localeCompare(b.name));
  if (!koVoice) { const ks = store.get('kvoice', null); koVoice = ko.find(v=>v.voiceURI===ks) || ko[0] || null; }
  kvsel.innerHTML = ko.map(v=>`<option value="${v.voiceURI.replace(/"/g,'&quot;')}">${v.name.replace(/\s*\(.*?\)\s*/g,'')}${qLabel(v)}</option>`).join('') || '<option>한국어 음성 없음</option>';
  if(koVoice) kvsel.value = koVoice.voiceURI;
  if (!AUDIO && vs.length && !ja.length){
    warn.hidden = false;
    warn.textContent = '이 기기에서 일본어 음성을 찾지 못했어요. 설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → 일본어에서 음성을 내려받은 뒤 다시 열어 주세요.';
  }
}
if (!AUDIO) vsel.addEventListener('change', () => { const v=synth.getVoices().find(x=>x.voiceURI===vsel.value); if(v){ jaVoice=v; store.set('voice', v.voiceURI); testJa(); } });
kvsel.addEventListener('change', () => { const v=synth.getVoices().find(x=>x.voiceURI===kvsel.value); if(v){ koVoice=v; store.set('kvoice', v.voiceURI); playOnce([{text:'안녕하세요. 오늘도 잘 부탁드립니다.', lang:'ko-KR'}]); } });
$('vtest').onclick = testJa;
if (synth) { pickVoices(); synth.onvoiceschanged = pickVoices; }
else if (!AUDIO) { warn.hidden=false; warn.textContent='이 브라우저는 음성 읽기를 지원하지 않아요. 아이폰·아이패드의 Safari에서 열어 주세요.'; }

// ---------- sound ----------
function cleanJa(t){
  return t.replace(/[（(][぀-ヿー・、\s\/／]+[)）]/g,'')
          .replace(/^[AB][:：]\s*/,'').replace(/[~〜]/g,'').replace(/[\/／]/g,'、').replace(/[①-⑩※]/g,'').trim();
}
const audio = new Audio(); audio.preload = 'auto';
let token = 0;
function tts(s, done){
  if (!synth || !s.text) { setTimeout(done, 50); return; }
  const u = new SpeechSynthesisUtterance(s.text);
  u.lang = s.lang; u.rate = s.lang==='ja-JP' ? rate : 1;
  const v = s.lang==='ja-JP' ? jaVoice : koVoice; if (v) u.voice = v;
  u.onend = done; u.onerror = () => setTimeout(done, 50);
  synth.speak(u);
}
function playStep(s, done){
  if (s.lang==='ja-JP' && AUDIO && s.a!=null && s.a!=='') {
    let fell = false;
    const fallback = () => { if (fell) return; fell = true; audio.onended = audio.onerror = null; tts(s, done); };
    audio.onended = () => { audio.onended = audio.onerror = null; done(); };
    audio.onerror = fallback;
    audio.src = AUDIO + avoice + '/' + s.a + '.mp3';
    audio.defaultPlaybackRate = audio.playbackRate = ARATE[rate] || 1;
    const p = audio.play();
    if (p && p.catch) p.catch(fallback);
    audio.addEventListener('playing', () => { audio.playbackRate = ARATE[rate] || 1; }, {once:true});
  } else tts(s, done);
}
function silence(){ token++; audio.onended = audio.onerror = null; audio.pause(); if (synth) synth.cancel(); }

// single tap: play a few steps, no queue
function playOnce(steps){
  stopAll();
  const my = token; let i = 0;
  const go = () => { if (my!==token) return; const s = steps[i++]; if(!s){ markEl(null); return; }
    markEl(s.el||null); playStep(s, () => setTimeout(go, s.gap||250)); };
  go();
}

// continuous play over "units" (a card on screen, or an item from data)
let units = [], ui = -1, playing = false, mode = null;
function startUnits(list, from, m){
  if (!list.length) return;
  silence(); units = list; ui = from - 1; mode = m; playing = true; setPlayBtn(); $('np').hidden = false; nextUnit(+1);
}
function nextUnit(dir){
  silence(); const my = token;
  ui += dir; if (ui < 0) ui = 0;
  if (ui >= units.length) { if (mode==='seq' && current) store.set('pos-'+current.id, 0); stopAll(); return; }
  const u = units[ui]; const steps = u.steps();
  showNow(u);
  if (mode==='seq' && current && u.idx!=null) store.set('pos-'+current.id, u.idx);
  let si = 0;
  const go = () => {
    if (my!==token) return;
    const s = steps[si++];
    if (!s) { setTimeout(() => { if (my===token) nextUnit(+1); }, 500); return; }
    markEl(s.el||null);
    playStep(s, () => setTimeout(go, s.gap||250));
  };
  go();
}
function stopAll(){ silence(); playing = false; units = []; ui = -1; markEl(null); markCard(null); $('np').hidden = true; setPlayBtn(); }
$('npStop').onclick = stopAll;
$('npNext').onclick = () => { if (playing) nextUnit(+1); };
$('npPrev').onclick = () => { if (playing) nextUnit(-1); };

let lastEl=null, lastCard=null;
function markEl(el){ if(lastEl) lastEl.classList.remove('now'); lastEl = el; if(el) el.classList.add('now'); }
function markCard(card){
  if(lastCard) lastCard.classList.remove('now'); lastCard = card;
  if(card){ card.classList.add('now'); card.scrollIntoView({block:'center',behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
}
function showNow(u){
  markCard(u.card && document.body.contains(u.card) ? u.card : null);
  $('npWhere').textContent = (mode==='shuffle' ? '섞어 듣기 · ' : '') + (u.where||'') + (units.length>1 ? `  ${ui+1} / ${units.length}` : '');
  $('npKo').textContent = u.ko || '';
  $('npJa').textContent = u.ja || '';
}

// steps from a card on screen or from a data item
function elSteps(card, withKo){
  const steps=[];
  if(withKo){ const k=card.querySelector('.ko'); if(k&&k.textContent.trim()) steps.push({text:k.textContent, lang:'ko-KR', el:null, gap:350}); }
  card.querySelectorAll('.j').forEach(el => { const t=cleanJa(el.textContent); if(t) steps.push({text:t, lang:'ja-JP', a:el.dataset.a, el, gap:700}); });
  return steps;
}
function itemSteps(it, withKo){
  const steps=[];
  if(withKo && it.k) steps.push({text:it.k, lang:'ko-KR', gap:350});
  for (const ln of it.l) if (ln[0]==='j') { const t=cleanJa(ln[1]); if(t) steps.push({text:t, lang:'ja-JP', a:ln[2], gap:700}); }
  return steps;
}
function cardUnit(card, idx){
  const js=[...card.querySelectorAll('.j')].map(e=>e.textContent);
  const ko=card.querySelector('.ko');
  return { card, idx, where: current ? current.t : '', ko: ko?ko.textContent:'', ja: js.join('  '), steps: () => elSteps(card, readKo && !card.classList.contains('flowline')) };
}
function itemUnit(it, ch, g){
  return { where: ch.t + (g.t ? ' · '+g.t : ''), ko: it.k, ja: it.l.filter(x=>x[0]==='j').map(x=>x[1]).join('  '), steps: () => itemSteps(it, readKo) };
}
const shuffled = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function firstAudioId(){ for (const c of chapters) for (const g of c.g) for (const it of (g.i||[])) for (const l of it.l) if (l[0]==='j' && l[2]!=null) return l[2]; return 0; }

// ---------- rendering ----------
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const da = id => id==null ? '' : ` data-a="${id}"`;
function cardHTML(it, n, noFrom){
  const hasJ = it.l.some(x=>x[0]==='j');
  let h = `<div class="card">${hasJ && !noFrom ? `<button class="no" aria-label="${n}번부터 이어 듣기">${n}</button>` : `<div class="no" style="padding-top:4px">${n}</div>`}<div>`;
  if (it.k) h += it.k.split('\n').filter(x=>x.trim()).map(x=>`<div class="ko">${esc(x)}</div>`).join('');
  for (const [c,t,a] of it.l){
    if (c==='j') h += `<div class="j" role="button" tabindex="0"${da(a)}>${esc(t)}</div>`;
    else if (c==='r') h += `<div class="r j-read" role="button" tabindex="0"${da(a)}>${esc(t)}</div>`;
    else h += `<div class="${c}">${esc(t)}</div>`;
  }
  if (it.f) h += `<div class="fx"><b>교정</b>${it.f.map(([a,b])=>a?`<s>${esc(a)}</s> → ${esc(b)}`:esc(b)).join(' · ')}</div>`;
  h += `</div>${hasJ?`<button class="say" aria-label="듣기">${ICON}</button>`:'<span></span>'}</div>`;
  return h;
}
function flowHTML(lines){
  return '<div class="flow">' + lines.map(([c,t,a]) => c==='j'
    ? `<div class="card flowline" style="display:block;padding:0;border:0"><div class="j" role="button" tabindex="0"${da(a)}>${esc(t)}</div></div>`
    : `<div class="${c}">${esc(t)}</div>`).join('') + '</div>';
}
const content = $('content');
let current = null;
const playBtn = $('playAll');
function chapterCards(){ return [...content.querySelectorAll('.card')].filter(c => c.querySelector('.j')); }
function setPlayBtn(){
  if (playing) { playBtn.textContent = '■ 멈추기'; playBtn.classList.add('on'); return; }
  playBtn.classList.remove('on');
  const pos = current ? store.get('pos-'+current.id, 0) : 0;
  playBtn.textContent = !current ? '▶ 듣기' : pos > 0 ? `▶ 이어 듣기 (${pos+1}번째부터)` : '▶ 이 장 듣기';
}
function renderChapter(id){
  stopAll();
  const c = chapters.find(x=>x.id===id) || chapters[0]; current = c;
  store.set('ch', c.id);
  document.querySelectorAll('.toc button').forEach(b=>b.setAttribute('aria-current', b.dataset.id===c.id?'true':'false'));
  let h = `<div class="eyebrow">${esc(c.part)} · ${esc(c.pj)}</div><h1>${esc(c.t)}</h1><div class="meta">${c.n? c.n.toLocaleString()+'개 문장·단어':'교재 필기'}</div>`;
  h += `<p class="hint">일본어 문장을 누르면 그 문장만, 왼쪽 번호(▶)를 누르면 거기서부터 이어서 읽어요. 위의 ‘이어 듣기’는 지난번에 멈춘 곳부터 시작해요.</p>`;
  c.g.forEach((g,gi) => {
    if (g.t) h += `<div class="grp"><span>${esc(g.t)}</span><button data-g="${gi}">▶ 이 부분 듣기</button></div>`;
    h += `<div class="gbody" data-g="${gi}">`;
    h += g.flow ? flowHTML(g.flow) : g.i.map((it,i)=>cardHTML(it,i+1)).join('');
    h += '</div>';
  });
  content.innerHTML = h;
  window.scrollTo(0,0);
  if (location.hash !== '#'+c.id) history.replaceState(null,'','#'+c.id);
  setPlayBtn();
}
function renderSearch(q){
  stopAll(); current = null; setPlayBtn();
  const nq = q.replace(/\s/g,'').toLowerCase();
  const hits = [];
  for (const c of chapters) for (const g of c.g){
    if (g.i) for (const it of g.i){
      const hay = (it.k + it.l.map(x=>x[1]).join('')).replace(/\s/g,'').toLowerCase();
      if (hay.includes(nq)) hits.push([c,g,it]);
    }
  }
  let h = `<div class="eyebrow">찾기</div><h1>“${esc(q)}”</h1><div class="meta">${hits.length.toLocaleString()}개 찾음${hits.length>300?' · 처음 300개만 보여요':''}</div>`;
  if (!hits.length) h += `<div class="empty">찾는 말이 없어요. 일본어 일부(예: 食べ)나 우리말 일부(예: 날씨)로 찾아 보세요.</div>`;
  h += '<div class="gbody">' + hits.slice(0,300).map(([c,g,it],i)=>cardHTML(it, i+1) + `<div class="meta" style="margin:-6px 0 6px 42px;font-size:12px">${esc(c.t)}${g.t?' · '+esc(g.t):''}</div>`).join('') + '</div>';
  content.innerHTML = h;
  window.scrollTo(0,0);
}

// ---------- TOC ----------
const toc = $('toc');
BOOK.forEach(p => {
  toc.insertAdjacentHTML('beforeend', `<div class="pt">${esc(p.t)}</div>`);
  p.ch.forEach(c => toc.insertAdjacentHTML('beforeend', `<button data-id="${c.id}">${esc(c.t)}<span>${c.n? c.n:''}</span></button>`));
});
const side=$('side'), scrim=$('scrim');
function drawer(open){ side.classList.toggle('open',open); scrim.classList.toggle('open',open); }
toc.addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; $('q').value=''; renderChapter(b.dataset.id); drawer(false); });
$('menu').onclick = () => drawer(true);
scrim.onclick = () => drawer(false);

// ---------- taps ----------
content.addEventListener('click', e => {
  const from = e.target.closest('button.no');
  if (from){ const cards = chapterCards(); const card = from.closest('.card'); const i = cards.indexOf(card);
    startUnits(cards.map((c,k)=>cardUnit(c,k)), Math.max(0,i), 'seq'); return; }
  const say = e.target.closest('.say');
  if (say){ playOnce(elSteps(say.closest('.card'), readKo)); return; }
  const g = e.target.closest('.grp button');
  if (g){ const all = chapterCards(); const body=content.querySelector(`.gbody[data-g="${g.dataset.g}"]`);
    const first = all.indexOf(body.querySelector('.card'));
    startUnits(all.map((c,k)=>cardUnit(c,k)), Math.max(0,first), 'seq'); return; }
  const j = e.target.closest('.j, .j-read');
  if (j){ const t=cleanJa(j.textContent); if(t) playOnce([{text:t, lang:'ja-JP', a:j.dataset.a, el:j}]); }
});
content.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && e.target.matches('.j, .j-read')){ e.preventDefault(); e.target.click(); } });

playBtn.onclick = () => {
  if (playing) { stopAll(); return; }
  const cards = chapterCards(); if (!cards.length) return;
  let pos = current ? store.get('pos-'+current.id, 0) : 0; if (pos >= cards.length) pos = 0;
  startUnits(cards.map((c,k)=>cardUnit(c,k)), pos, 'seq');
};
$('shuffle').onclick = () => {
  if (scope === 'book') {
    const all = [];
    for (const c of chapters) for (const g of c.g) for (const it of (g.i||[])) if (it.l.some(x=>x[0]==='j')) all.push(itemUnit(it, c, g));
    startUnits(shuffled(all), 0, 'shuffle');
  } else {
    const cards = chapterCards();
    startUnits(shuffled(cards.map(c=>cardUnit(c,null))), 0, 'shuffle');
  }
};

// ---------- settings ----------
const speedBtns = document.querySelectorAll('.speed button[data-r]');
function setRate(r){ rate=r; store.set('rate',r); speedBtns.forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.r===r))); }
speedBtns.forEach(b => b.onclick = () => setRate(+b.dataset.r)); setRate(rate);
const scopeBtns = document.querySelectorAll('#scope button');
function setScope(s){ scope=s; store.set('scope',s); scopeBtns.forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.s===s))); $('shuffle').textContent = s==='book' ? '섞어 듣기 (책 전체)' : '섞어 듣기'; }
scopeBtns.forEach(b => b.onclick = () => setScope(b.dataset.s)); setScope(scope);
const koBtn = $('koToggle');
koBtn.setAttribute('aria-pressed', String(readKo));
koBtn.onclick = () => { readKo=!readKo; store.set('ko',readKo); koBtn.setAttribute('aria-pressed', String(readKo)); };
const big = $('bigger');
function setFs(v){ fs=v; store.set('fs',v); document.documentElement.style.setProperty('--fs', v); big.textContent = v>1 ? '가 보통' : '가 크게'; }
big.onclick = () => setFs(fs>1 ? 1 : 1.25); setFs(fs);

let st; $('q').addEventListener('input', e => { clearTimeout(st); const v=e.target.value.trim(); st=setTimeout(()=> v ? renderSearch(v) : renderChapter(store.get('ch', chapters[0].id)), 250); });
window.addEventListener('hashchange', () => { const id=location.hash.slice(1); if(chapters.some(c=>c.id===id) && (!current||current.id!==id)) renderChapter(id); });
const start = location.hash.slice(1);
renderChapter(chapters.some(c=>c.id===start) ? start : store.get('ch', chapters[0].id));

</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
